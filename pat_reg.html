{% extends "base.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}

    <body style="background-image: url(https://images.pexels.com/photos/17485658/pexels-photo-17485658.png);" class="min-h-screen flex items-center justify-center bg-cover bg-center">
        <div class="max-w-lg">
            <div class="rounded-md bg-white/10 backdrop-blur-lg p-6 text-white border border-white/20 hover:border-gray-900 transition-all duration-400 flex flex-col items-center space-y-4 max-w-md shadow-lg">
                <h1 style="font-family: Zain, sans-serif; font-weight: 600; font-style: normal;" class="text-4xl text-gray-900 text-center mb-4 flex items-center justify-center gap-2">
                    Patient Register
                    <span class="w-3 h-3 bg-green-500 rounded-full inline-block"></span>
                </h1>      
                <form class="flex flex-col items-center gap-4" method="POST">
                    <input class="h-8 w-64 rounded-md text-center bg-white font-semibold text-gray-500" name="name" placeholder="Full Name" type="text" style="font-family: Zain, sans-serif;">
                    <input class="h-8 w-64 rounded-md bg-white font-semibold text-gray-500 text-center" name="dob" placeholder="Date of Birth" type="text" onfocus="(this.type='date')" onblur="if(this.value==''){this.type='text'}" style="font-family: Zain, sans-serif; text-align: center; color:#6B7280;">
                    <input class="h-8 w-64 rounded-md text-center bg-white font-semibold text-gray-500" name="address" placeholder="Address" type="address" style="font-family: Zain, sans-serif;">
                    <input class="h-8 w-64 rounded-md text-center bg-white font-semibold text-gray-500" name="phone" placeholder="Phone Number" type="text" style="font-family: Zain, sans-serif;">
                    <input class="h-8 w-64 rounded-md text-center bg-white font-semibold text-gray-500" name="med_num" placeholder="Medical (NHS) Number" type="text" style="font-family: Zain, sans-serif;">
                    <input class="h-8 w-64 rounded-md text-center bg-white font-semibold text-gray-500" name="email" placeholder="Email" type="email" style="font-family: Zain, sans-serif;">
                    <input class="h-8 w-64 rounded-md text-center bg-white font-semibold text-gray-500" name="password" placeholder="Password" type="password" style="font-family: Zain, sans-serif;">
                    <input class="h-8 w-64 rounded-md text-center bg-white font-semibold text-gray-500" name="confirmation" placeholder="Confirm Password" type="password" style="font-family: Zain, sans-serif;">
                    <label class="flex items-center gap-2 text-gray-900 text-sm" style="font-family: Zain, sans-serif;"><input id="consent" name="consent" type="checkbox" value="yes" class="h-4 w-4 rounded text-green-500 focus:ring-2 focus:ring-green-300"> I consent to my personal and medical data being stored and processed in accordance with UK GDPR.</label>
                    <button class="rounded-md bg-gray-900 px-4 py-2 text-white cursor-pointer font-semibold hover:bg-gray-600 transition-all duration-300 mt-2" type="submit">Register</button>
                </form>
            </div>
        </div>
    </body>
    
{% endblock %}
