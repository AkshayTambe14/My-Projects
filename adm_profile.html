{% extends "base.html" %}

{% block title %}
    Admin Profile
{% endblock %}

{% block main %}
    <body class="flex min-h-screen text-gray-900 bg-gradient-to-l from-purple-500 to-purple-700 h-64 w-full">
        <aside class="m-2 mt-2 rounded-md bg-white shadow-lg border-r border-gray-200 flex flex-col min-h-screen p-4">
            <div class="flex items-center space-x-2 mb-6">
                <h1 style="font-family: Zain, sans-serif; font-weight: 600; font-style: normal;" class="text-5xl font-semibold text-blue-600">ChronoCare</h1>
                <circle cx="12" cy="12" r="12" />
                <path d="M12 6v6l4 2" />
                </svg>
            </div>
        
            <nav class="flex-1 space-y-2">
                <a style="font-family: Zain, sans-serif; font-weight: 400; font-style: normal;" href="/admindashboard" class="text-2xl flex items-center p-2 rounded-xl hover:bg-purple-300 transition">Dashboard</a>
        
                <a style="font-family: Zain, sans-serif; font-weight: 400; font-style: normal;" href="/doctors" class="text-2xl flex items-center p-2 rounded-xl hover:bg-purple-300 transition">Doctors</a>
            
                <a style="font-family: Zain, sans-serif; font-weight: 400; font-style: normal;" href="/patients" class="text-2xl flex items-center p-2 rounded-xl hover:bg-purple-300 transition">Patients</a>
        
                <a style="font-family: Zain, sans-serif; font-weight: 400; font-style: normal;" href="/adminprofile" class="text-2xl flex items-center p-2 rounded-xl bg-purple-900 text-white">Profile</a>
            </nav>
        
            <a style="font-family: Zain, sans-serif; font-weight: 400; font-style: normal;" href="/logout" class="text-lg mt-6 mx-auto text-red-600 font-semibold hover:underline">Logout</a>
        </aside>

        <div class="min-w-half flex items-center h-auto flex-wrap mx-auto my-32 lg:my-0">
            <div id="profile" class="min-w-half rounded-md bg-white/10 backdrop-blur-lg p-4 text-white border border-white/20">
                <div class="p-4 md:p-12 text-center lg:text-left">

                    <h1 style="font-family: Zain, sans-serif;" class="text-4xl text-center font-bold pt-8 lg:pt-0">{{ admin.name|title }}</h1>

                    <p style="font-family: Zain, sans-serif;" class="pt-4 text-lg font-bold flex items-center justify-center lg:justify-start">
                        <svg class="h-4 fill-current text-purple-700 pr-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                          </svg>                                                  
                        {{ admin.email }}
                    </p>

                    <p style="font-family: Zain, sans-serif;" class="pt-4 text-lg flex items-center justify-center lg:justify-start">
                        <svg class="h-4 fill-current text-purple-700 pr-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4a2 2 0 0 1-2-2V6c0-1.1.9-2 2-2zm0 2v.01L12 13 20 6.01V6H4z"/>
                          </svg>                          
                        {{ admin.dob }}
                    </p>

                    <p style="font-family: Zain, sans-serif;" class="pt-4 text-lg flex items-center justify-center lg:justify-start">
                        <svg class="h-4 fill-current text-purple-700 pr-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path d="M2 2a2 2 0 0 1 2-2h3l2 5-2 1a11 11 0 0 0 5 5l1-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 2 2z"/>
                          </svg>                          
                        {{ admin.phone }}
                    </p>
                        
                    <div class="mt-2">
                        <div class="flex justify-center">
                            <button onclick="openPinPopup()" style="font-family: Zain, sans-serif; font-weight: 500; font-style: normal;" class="mt-3 ml-2 cursor-pointer bg-white hover:bg-gray-100 text-black px-6 py-2 rounded-lg font-medium transition-colors" name="action" value="pin">Pin Doctor</button>
                        </div>
                    </div>

                    <div id="PinPopup" class="hidden fixed inset-0 flex items-center justify-center z-50">
                        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closePinPopup()"></div>
                        
                        <div class="relative min-w-[350px] max-w-xl text-center rounded-md bg-white p-6 text-black border border-purple-400 shadow-xl flex flex-col items-center" style="font-family: Zain, sans-serif;">
                          <span class="absolute top-2 right-4 text-2xl cursor-pointer hover:text-gray-700" onclick="closePinPopup()">&times;</span>
                          <h2 class="mb-4 text-2xl font-semibold text-purple-900">Pin Doctors</h2>
                          
                          <form method="post" onsubmit="prepareSubmit()" class="w-full flex flex-col gap-4 items-center">
                      
                            <div class="w-full relative">
                              <input type="text" id="searchInput" autocomplete="off" placeholder="Search by name..." class="px-4 py-2 w-full text-white text-xl rounded-lg shadow-md border border-purple-900 bg-purple-900 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-400" style="font-family: Zain, sans-serif;" />
                              
                              <ul id="suggestionList" class="absolute top-full left-0 right-0 bg-white border border-gray-300 rounded-md shadow-lg z-20 mt-1 text-left hidden max-h-40 overflow-y-auto"></ul>
                            </div>
                      
                            <div>
                              <button type="button" onclick="addDoctor()" class="px-4 py-2 rounded-lg bg-purple-700 text-white hover:bg-purple-800 transition shadow font-medium">Add</button>
                            </div>
                      
                            <ul id="selectedDoctors" class="w-full pt-4 space-y-2"></ul>
                            <input type="hidden" name="doctors" id="doctorsInput" />
                      
                            <div class="flex justify-center space-x-3 pt-4">
                              <button type="submit" class="px-4 py-2 rounded-lg bg-purple-700 hover:bg-purple-800 text-white font-medium transition">Select Doctors</button>
                            </div>
                      
                          </form>
                        </div>
                      </div>
                    
                </div>
            </div>
        </div>
    </body>

    <script>
        function openPinPopup() {document.getElementById("PinPopup").style.display = "flex";}
        function closePinPopup() {document.getElementById("PinPopup").style.display = "none";}

        const selectedDoctors = [];

        function addDoctor() {
            const input = document.getElementById("searchInput");
            const value = input.value.trim();

            if (!value) return;
            if (selectedDoctors.length >= 3) {
                alert("You can only select up to 3 doctors.");
                return;
            }

            selectedDoctors.push(value);

            renderDoctors();

            input.value = "";
        }

        function renderDoctors() {
            const list = document.getElementById("selectedDoctors");
            list.innerHTML = "";

            selectedDoctors.forEach((doc, index) => {
                const li = document.createElement("li");
                li.className = "flex justify-between bg-gray-100 px-3 py-2 rounded-lg";
                li.innerHTML = `
                <span>${doc}</span>
                <button type="button" onclick="removeDoctor(${index})" class="text-red-500 font-bold">×</button>
                `;
                list.appendChild(li);
            });
        }

        function removeDoctor(index) {
            selectedDoctors.splice(index, 1);
            renderDoctors();
        }

        function prepareSubmit() {
            document.getElementById("doctorsInput").value = JSON.stringify(selectedDoctors);
        }

        const doctorlist = [
                {% for doctor in doctors %}
                    "{{ doctor.name|escape }}",
                {% endfor %}
            ];

        const searchInput = document.getElementById('searchInput');
        const suggestionList = document.getElementById('suggestionList');
        const cards = document.querySelectorAll('.doctor-card');

        function filterCards(query) {
            query = query.toLowerCase();
            cards.forEach(card => {
                const name = card.getAttribute('data-name');
                card.style.display = name.includes(query) ? 'block' : 'none';
            });
        }

        function showSuggestions() {
            const value = searchInput.value.trim().toLowerCase();
            suggestionList.innerHTML = "";
            suggestionList.classList.add("hidden");
            if (value.length === 0) return;
            const matched = doctorlist.filter(p => p.toLowerCase().includes(value));
            if (matched.length === 0) return;
            matched.forEach(name => {
                const li = document.createElement("li");
                li.className = "px-4 py-2 hover:bg-purple-100 cursor-pointer";
                li.textContent = name;
                li.onclick = function () {
                    searchInput.value = name;
                    filterCards(name);
                    suggestionList.classList.add("hidden");
                };
                suggestionList.appendChild(li);
            });
            suggestionList.classList.remove("hidden");
        }

        searchInput.addEventListener('input', function () {
            showSuggestions();
            filterCards(searchInput.value);
        });

        document.addEventListener("click", function (e) {
            if (!searchInput.contains(e.target) && !suggestionList.contains(e.target)) {
                suggestionList.classList.add("hidden");
            }
        });
    </script>
{% endblock %}
